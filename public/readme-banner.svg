<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Trivectra privacy suite</title>
  <desc id="desc">Animated signal paths orbit a glowing shield, representing audit, encrypted storage, and peer-to-peer transfer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10172a"/>
      <stop offset=".55" stop-color="#171337"/>
      <stop offset="1" stop-color="#092532"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9aa8ff" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>
  <path d="M0 270C240 210 330 330 590 265s390-75 610-10v85H0Z" fill="#8b5cf6" opacity=".07"/>
  <path d="M0 295C260 235 390 350 650 285s350-40 550-10" fill="none" stroke="url(#beam)" stroke-width="2" opacity=".65">
    <animate attributeName="stroke-dasharray" values="8 18;32 12;8 18" dur="6s" repeatCount="indefinite"/>
  </path>
  <g fill="#b9c6ff">
    <circle cx="80" cy="72" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="460" cy="54" r="2"><animate attributeName="opacity" values="1;.25;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="550" cy="218" r="1.5"><animate attributeName="opacity" values=".2;.9;.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="74" r="2"><animate attributeName="opacity" values=".3;1;.3" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="76" y="122" fill="#a78bfa" font-size="13" font-weight="700" letter-spacing="4">YOUR DIGITAL PRIVACY SUITE</text>
    <text x="72" y="190" fill="#f8f7ff" font-size="58" font-weight="750" letter-spacing="-2">Know. Protect. Share.</text>
    <text x="78" y="230" fill="#bac2dc" font-size="18">Three privacy tools. One place. Your browser stays in control.</text>
    <g font-size="13" font-weight="700" letter-spacing="1">
      <rect x="78" y="265" width="108" height="34" rx="17" fill="#8b5cf6" fill-opacity=".2" stroke="#a78bfa" stroke-opacity=".65"/>
      <text x="132" y="287" fill="#ded5ff" text-anchor="middle">◉ AUDIT</text>
      <rect x="198" y="265" width="112" height="34" rx="17" fill="#22d3ee" fill-opacity=".12" stroke="#67e8f9" stroke-opacity=".55"/>
      <text x="254" y="287" fill="#baf6ff" text-anchor="middle">▣ VAULT</text>
      <rect x="322" y="265" width="132" height="34" rx="17" fill="#34d399" fill-opacity=".1" stroke="#6ee7b7" stroke-opacity=".5"/>
      <text x="388" y="287" fill="#b9ffe2" text-anchor="middle">⇄ TRANSFER</text>
    </g>
  </g>
  <g transform="translate(910 166)" fill="none">
    <circle r="116" stroke="#8b5cf6" stroke-opacity=".15" stroke-width="1"/>
    <circle r="92" stroke="#22d3ee" stroke-opacity=".24" stroke-width="1" stroke-dasharray="3 9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="32s" repeatCount="indefinite"/>
    </circle>
    <ellipse rx="134" ry="48" stroke="#a78bfa" stroke-opacity=".42" stroke-width="1.5" transform="rotate(-28)">
      <animateTransform attributeName="transform" type="rotate" from="-28" to="332" dur="18s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="134" ry="48" stroke="#22d3ee" stroke-opacity=".35" stroke-width="1.5" transform="rotate(40)">
      <animateTransform attributeName="transform" type="rotate" from="40" to="-320" dur="24s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="-120" cy="-58" r="4" fill="#c4b5fd" filter="url(#glow)">
      <animateMotion dur="8s" repeatCount="indefinite" path="M0 0 A132 48 -28 1 1 240 116 A132 48 -28 1 1 0 0"/>
    </circle>
    <circle cx="0" cy="0" r="57" fill="#12182d" stroke="url(#shield)" stroke-width="2" filter="url(#glow)">
      <animate attributeName="r" values="55;59;55" dur="4s" repeatCount="indefinite"/>
    </circle>
    <path d="M0-32 27-22v23c0 21-12 34-27 42C-15 35-27 22-27 1v-23Z" fill="url(#shield)" fill-opacity=".18" stroke="url(#shield)" stroke-width="3"/>
    <path d="m-12 0 9 9 17-19" stroke="#ecfeff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle r="72" stroke="#22d3ee" stroke-opacity=".12">
      <animate attributeName="r" values="64;104;64" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0;.7" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="1115" y="312" fill="#8c95b4" font-family="Segoe UI,Arial,sans-serif" font-size="11" text-anchor="end" letter-spacing="2">BUILT FOR PRIVACY</text>
</svg>
